version: '3.8'

services:
  comp-jv21pat-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: comp-jv21pat:latest
    container_name: comp-jv21pat-container
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport
      - TZ=UTC
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  logs:
  config: